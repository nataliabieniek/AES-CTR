services:
  dev:
    build: .
    image: prir-aes-ctr
    volumes:
      - .:/workspace
    working_dir: /workspace
    stdin_open: true
    tty: true
    shm_size: "1gb"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
